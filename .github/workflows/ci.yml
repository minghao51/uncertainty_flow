name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra opinion
      - uses: pre-commit/action@v3.0.1

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra opinion
      - run: uv run mypy uncertainty_flow/

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra opinion
      - run: uv run pytest tests/ --ignore=tests/models/test_deep_quantile_torch.py -q

  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: quarto-dev/quarto-action/setup@v2
      - run: uv sync --extra docs
      - name: Render notebooks (uses _freeze/, no execution)
        run: uv run quarto render notebooks/
      - name: Generate notebook doc stubs
        run: uv run python scripts/generate_notebook_docs.py
      - name: Build documentation
        run: uv run mkdocs build

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra opinion
      - run: uv run bandit -r uncertainty_flow -s B101,B110,B301,B403
      - run: uv run pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-1839
