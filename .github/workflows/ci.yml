name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - uses: pre-commit/action@v3.0.1
      - name: Verify Ruff quality gates
        run: |
          uv run ruff check .
          uv run ruff format . --check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy uncertainty_flow/

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ --ignore=tests/models/test_deep_quantile_torch.py -q --cov-fail-under=80
      - name: Run deployment conformance tests
        run: uv run pytest -q --no-cov tests/benchmarking/test_deployment.py tests/benchmarking/test_local_artifact_store.py
      - name: Report touched modules in this branch
        run: uv run python scripts/report_touched_modules.py

  optional-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --extra dev --extra ml
      - name: Run optional dependency tests (NumPyro + Torch + SHAP)
        run: uv run pytest -q tests/bayesian/test_numpyro_model.py tests/models/test_deep_quantile_torch.py tests/calibration/test_shap.py

  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: quarto-dev/quarto-action/setup@v2
      - run: uv sync --extra docs
      - name: Render notebooks (uses _freeze/, no execution)
        run: uv run quarto render notebooks/
      - name: Generate notebook doc stubs
        run: uv run python scripts/generate_notebook_docs.py
      - name: Verify notebook docs are in sync
        run: git diff --exit-code -- docs/notebooks
      - name: Verify notebook links use noopener
        run: |
          if rg 'target="_blank"(?![^>]*rel="noopener noreferrer")' docs/notebooks/*.md -n -P; then
            echo "Found target=_blank links without rel=noopener noreferrer"
            exit 1
          fi
      - name: Build documentation
        run: uv run mkdocs build --strict

  evidence-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evidence-site/package-lock.json
      - run: npm ci --prefix evidence-site
      - run: npm run build --prefix evidence-site
      - name: Verify generated evidence ignore policy
        run: |
          git check-ignore --no-index -q evidence-site/public/evidence/index.json
          if git check-ignore --no-index -q evidence-site/public/evidence/.gitkeep; then
            echo "public/evidence/.gitkeep must remain trackable"
            exit 1
          fi

  base-cli-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the package
        run: uv build
      - name: Install into an isolated base environment
        run: |
          uv venv .venv-base
          uv pip install --python .venv-base/bin/python dist/*.whl
      - name: Smoke-test the base CLI surface
        run: |
          .venv-base/bin/uncertainty-flow --help
          .venv-base/bin/python -c "import uncertainty_flow.cli"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate security/warning policy metadata
        run: uv run python scripts/ci_policy_checks.py
      - run: uv run bandit -r uncertainty_flow -s B101,B110
      - run: uv run pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-1839  # owner=ml-platform expires=2026-12-31
