name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev mypy uncertainty_flow/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --extra dev pytest tests/ --ignore=tests/models/test_deep_quantile_torch.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv run --extra dev bandit -r uncertainty_flow -s B101,B110,B301,B403
      - run: uv run --extra dev pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-1839
