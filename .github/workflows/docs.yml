name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'notebooks/**'
      - 'scripts/generate_notebook_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache MkDocs site
        id: cache
        uses: actions/cache@v4
        with:
          path: site/
          key: mkdocs-${{ hashFiles('mkdocs.yml', 'docs/**', 'notebooks/**', 'scripts/generate_notebook_docs.py', '.github/workflows/docs.yml', 'pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync --extra docs

      - name: Generate notebook doc stubs + HTML exports
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python scripts/generate_notebook_docs.py

      - name: Build MkDocs
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
