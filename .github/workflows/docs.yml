name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'notebooks/**'
      - 'scripts/generate_notebook_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache MkDocs site
        id: cache
        uses: actions/cache@v4
        with:
          path: site/
          key: mkdocs-${{ hashFiles('mkdocs.yml', 'docs/**', 'notebooks/**', 'scripts/generate_notebook_docs.py', '.github/workflows/docs.yml') }}

      - name: Generate notebook doc stubs
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv run python scripts/generate_notebook_docs.py

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync --extra docs

      - name: Check for notebook changes
        if: steps.cache.outputs.cache-hit != 'true'
        id: notebook_check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" HEAD | grep -q "^notebooks/" && \
              echo "changed=true" >> $GITHUB_OUTPUT || \
              echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build MkDocs
        if: steps.cache.outputs.cache-hit != 'true'
        id: build
        continue-on-error: true
        run: uv run mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
