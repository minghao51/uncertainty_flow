repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/notebooks/html/|notebooks/_freeze/)
      - id: end-of-file-fixer
        exclude: ^(docs/notebooks/html/|notebooks/_freeze/)
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^docs/notebooks/html/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.14
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  - repo: local
    hooks:
      - id: quarto-render
        name: Render changed .qmd notebooks
        entry: make notebooks-staged
        language: system
        files: '^notebooks/.*\.qmd$'
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy uncertainty_flow/
        language: system
        types: [python]
        files: ^uncertainty_flow/
        pass_filenames: false
