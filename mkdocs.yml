site_name: Uncertainty Flow
site_description: Probabilistic forecasting and uncertainty quantification
site_url: https://minghao51.github.io/uncertainty_flow/
repo_url: https://github.com/minghao51/uncertainty_flow
repo_name: minghao51/uncertainty_flow
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          docstring_style: google
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: README.md
  - Guides:
      - Distribution Approach: guides/distribution-approach.md
      - Models: guides/models.md
      - Calibration: guides/calibration.md
      - Charting: guides/charting.md
      - Benchmarking: guides/benchmarking.md
      - Design Principles: guides/design.md
  - Architecture:
      - Overview: architecture/overview.md
      - ADR-001 Model Persistence: adr/001-model-persistence-format.md
      - ADR-002 Hamilton Boundary: adr/002-hamilton-boundary.md
      - ADR-003 Medallion Artifacts: adr/003-medallion-artifacts.md
      - ADR-004 Run Identity and Status: adr/004-run-identity-and-status.md
      - ADR-005 Evidence Export: adr/005-evidence-export.md
  - API Reference:
      - Benchmarking: api/benchmarking.md
      - Core: api/core.md
      - Metrics: api/metrics.md
      - Models: api/models.md
      - Wrappers: api/wrappers.md
      - Risk: api/risk.md
      - Causal: api/causal.md
      - Analysis: api/analysis.md
      - Decomposition: api/decomposition.md
      - Counterfactual: api/counterfactual.md
      - Multivariate: api/multivariate.md
      - Multimodal: api/multimodal.md
      - Bayesian: api/bayesian.md
      - Calibration Module: api/calibration-module.md
      - Utils: api/utils.md
      - Viz: api/viz.md
      - CLI: api/cli.md
  - Notebooks:
      - Overview: notebooks/index.md
      - Quick Start: notebooks/01-quick-start.md
      - Time Series: notebooks/02-time-series.md
      - Diagnostics & Calibration: notebooks/03-diagnostics-calibration.md
      - Risk & Multivariate: notebooks/04-risk-copulas.md
      - Methods & Benchmarks: notebooks/05-benchmarks.md
  - Benchmarks: benchmarks/README.md
  - Operations:
      - Deployment: operations/deployment.md
      - Recovery: operations/recovery.md
      - Verification: operations/verification.md
  - Project:
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
      - Roadmap: project/roadmap.md
      - Technical Roadmap: project/technical_roadmap.md
      - Benchmark API Specification: api/spec.md
      - Comprehensive Benchmark Report: benchmarks/20260426-comprehensive-run.md
      - Active Plans:
          - Hamilton/Medallion Refactor: plans/20260713-hamilton-medallion-refactor-plan.md
          - External Integrations and Debt: plans/20260715-external-integrations-and-debt-handoff.md

exclude_docs: |
  archive/**
  plans/20260401-v6-plus-design.md
  plans/20260411-phase4-runtime-handoff.md
  plans/20260520-hardening-handoff.md

extra_css:
  - stylesheets/notebooks.css
extra_javascript:
  - javascripts/notebooks.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - md_in_html
