[project]
name = "uncertainty-flow"
version = "0.1.0"
description = "Probabilistic forecasting and uncertainty quantification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "pyarrow>=23.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
]
torch = [
    "torch>=2.0.0",
]
transformers = [
    "chronos-forecasting>=2.0",
]
shap = [
    "shap>=0.44.0",
]
bench = [
    "datasets>=2.0.0",
]
numpyro = [
    "numpyro>=0.14.0",
    "jax>=0.4.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
uncertainty-flow = "uncertainty_flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uncertainty_flow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--durations=10", "--import-mode=importlib", "--cov=uncertainty_flow", "--cov-report=term-missing", "--cov-report=html", "--cov-fail-under=65"]
markers = [
    "unit: fast, focused tests for a single module or behavior",
    "integration: tests covering multi-module workflows or heavier model interactions",
    "slow: expensive tests that are useful to exclude during quick local iteration",
    "optional: tests that rely on optional dependency stacks or non-core integrations",
    "network: tests requiring internet access",
    "smoke: critical path tests for CI gating",
]
filterwarnings = [
    "ignore:Stochastic Optimizer",
    "ignore:Degrees of freedom <= 0 for slice:RuntimeWarning",
    "ignore:divide by zero encountered in divide:RuntimeWarning",
    "ignore:invalid value encountered in multiply:RuntimeWarning",
    "ignore:invalid value encountered in log:RuntimeWarning",
    "ignore:An input array is constant",
    "ignore::uncertainty_flow.utils.exceptions.UncertaintyFlowWarning",
]

[tool.coverage.run]
branch = true
source = ["uncertainty_flow"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "uncertainty_flow/viz/dashboard.py",
    "uncertainty_flow/models/deep_quantile_torch.py",
    "uncertainty_flow/bayesian/numpyro_model.py",
    "uncertainty_flow/calibration/shap_values.py",
    "uncertainty_flow/models/transformer_forecaster.py",
]

[tool.coverage.report]
fail_under = 65.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
disable_error_code = [
    "no-any-return",
    "misc",
    "override",
    "union-attr",
    "attr-defined",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B110", "B403"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.0",
]
